name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check scripts
        run: bash -n Scripts/build.sh Scripts/install.sh Scripts/test.sh 실행.command
      - name: Test
        run: bash Scripts/test.sh
      - name: Audit public files
        run: python3 Scripts/audit-public.py
